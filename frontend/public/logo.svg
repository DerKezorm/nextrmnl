<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="nextrmnl">
  <!-- Terminal window with a prompt, light on a white tile; dark when the system is dark.
       Same shape as components/Logo.tsx and scripts/app-icons.mjs. -->
  <style>
    .grund { fill: #fff } .rand { stroke: #8b5cf6; stroke-opacity: .35 } .cursor { stroke: #7c3aed }
    .v1 { stop-color: #c4b5fd } .v2 { stop-color: #8b5cf6 } .v3 { stop-color: #4c1d95 }
    @media (prefers-color-scheme: dark) {
      .grund { fill: #110d1a } .rand { stroke: #a78bfa; stroke-opacity: .45 } .cursor { stroke: #c4b5fd }
      .v1 { stop-color: #ede9fe } .v2 { stop-color: #a78bfa } .v3 { stop-color: #7c3aed }
    }
  </style>
  <defs>
    <linearGradient id="g" gradientUnits="userSpaceOnUse" x1="10" y1="10" x2="54" y2="54">
      <stop offset="0" class="v1"/><stop offset=".5" class="v2"/><stop offset="1" class="v3"/>
    </linearGradient>
  </defs>
  <rect class="grund" x="2" y="2" width="60" height="60" rx="16"/>
  <rect class="rand" x="2.75" y="2.75" width="58.5" height="58.5" rx="15.3" fill="none" stroke-width="1.5"/>
  <rect x="10" y="13" width="44" height="38" rx="5.5" fill="none" stroke="url(#g)" stroke-width="4.2"/>
  <path d="M10 22h44" stroke="url(#g)" stroke-width="3" stroke-opacity=".55"/>
  <circle cx="16" cy="17.6" r="1.7" fill="url(#g)"/><circle cx="21.5" cy="17.6" r="1.7" fill="url(#g)"/><circle cx="27" cy="17.6" r="1.7" fill="url(#g)"/>
  <path d="M18 30 24.5 36 18 42" fill="none" stroke="url(#g)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="cursor" d="M29 42h11" stroke-width="4" stroke-linecap="round"/>
</svg>
